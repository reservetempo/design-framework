  <rect x="360" y="440" width="380" height="100" rx="24" fill="#6d4a7a"/>
  <rect x="380" y="400" width="80" height="70" rx="16" fill="#e0a43c"/>
  <rect x="470" y="404" width="78" height="66" rx="16" fill="#a33b32"/>
  <rect x="558" y="400" width="80" height="70" rx="16" fill="#3f7f6a"/>
  <rect x="648" y="406" width="70" height="64" rx="16" fill="#e9d7b4"/>
  <path d="M600 440 L700 440 L690 540 L620 540 Z" fill="#e9d7b4"/>
  <g stroke="#a33b32" stroke-width="4"><line x1="610" y1="470" x2="690" y2="470"/><line x1="614" y1="500" x2="686" y2="500"/></g>
