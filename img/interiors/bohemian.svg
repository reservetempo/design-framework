  <path d="M800 600 L812 530 L888 530 L900 600 Z" fill="#c45d3a"/>
  <g fill="#4f7a4a"><path d="M850 530 Q790 440 760 420 Q830 450 850 530"/><path d="M850 530 Q860 410 900 360 Q880 450 850 530"/><path d="M850 530 Q920 470 950 470 Q900 500 850 530"/><path d="M850 530 Q820 430 840 340 Q850 450 850 530"/></g>
  <ellipse cx="300" cy="600" rx="60" ry="26" fill="#e0a43c"/>
  <ellipse cx="300" cy="590" rx="60" ry="24" fill="#f0c25a"/>
